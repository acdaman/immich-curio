services:
  curio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=UTC  # override in .env or here: e.g. TZ=America/New_York
    volumes:
      - ./prompt.md:/app/prompt.md:ro
      - ./prompt_group.md:/app/prompt_group.md:ro
      # Uncomment and adjust if EXPORT_ENABLED=true:
      # - /your/syncthing/or/nfs/path:/exports

    # Networking: Curio needs to reach the Immich Postgres container.
    # Option A (recommended): Join Immich's internal Docker network.
    #   Replace "immich-network" with whatever your Immich stack's network is named.
    # Option B: Expose Postgres to the host and set DB_HOST=host.docker.internal.
    networks:
      - immich-network

networks:
  immich-network:
    external: true
