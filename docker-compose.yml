services:
  curio:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Australia/Sydney
    volumes:
      - ./prompt.md:/app/prompt.md:ro
      - ./prompt_group.md:/app/prompt_group.md:ro
    networks:
      - postgres-net

networks:
  postgres-net:
    external: true
